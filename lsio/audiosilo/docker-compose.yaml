# [AudioSilo](https://audiosilo.app) is a self-hosted audiobook server. Point it
# at your audiobook folders and listen from the built-in web player or the
# AudioSilo apps for iOS and Android, with listening progress synced across
# devices.

---
services:
  audiosilo:
    image: lscr.io/linuxserver/audiosilo:latest
    container_name: audiosilo
    environment:
      # Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
      - PUID=${PUID:-1000}
      # Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
      - PGID=${PGID:-1000}
      # specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
      - TZ=${TZ:-Etc/UTC}
    volumes:
      # Persistent config files, database, backups and TLS certificates.
      - ${BASEDIR:-/srv/lsio}/audiosilo/config:/config
      # Audiobooks location, read-only (the server never writes to your books). Add it as a library in the admin console.
      - ${BASEDIR:-/srv/lsio}/audiosilo/audiobooks:ro:/audiobooks:ro
    ports:
      # Web player, admin console and the API the apps connect to.
      - 8080:8080
    restart: unless-stopped