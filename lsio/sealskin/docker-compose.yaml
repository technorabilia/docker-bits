# [Sealskin](https://github.com/selkies-project/sealskin/) is a self-hosted
# browser isolation and remote application streaming platform. It runs desktop
# applications in isolated containers on a server you control and streams them
# to any browser or phone. Clients include a browser extension, mobile apps, and
# a web app served by the server itself. Each turns links, files, downloads, and
# text selections into something you open remotely instead of locally, so
# nothing from the web runs on the device in front of you.

---
services:
  sealskin:
    image: lscr.io/linuxserver/sealskin:latest
    container_name: sealskin
    environment:
      # Run 'id [USER]' for the owner of the host volume directories to get the UID to use here.
      - PUID=${PUID:-1000}
      # Run 'id [USER]' for the owner of the host volume directories to get the GID to use here.
      - PGID=${PGID:-1000}
      # specify a timezone to use, see this [list](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List).
      - TZ=${TZ:-Etc/UTC}
      # On initial setup this will be used to fill in the default admin configuration file in the `/config` directory, if unset the string HOST_URL will need to be replaced. [OPTIONAL]
      - HOST_URL=IP or subdomain.domain.com
    volumes:
      # All configuration files and metadata for the application.
      - ${BASEDIR:-/srv/lsio}/sealskin/config:/config
      # All file storage for home directories and ephemeral mounts.
      - ${BASEDIR:-/srv/lsio}/sealskin/storage:/storage
      # Docker socket, required to spin up application containers.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # HTTPS Sessions and API communication port.
      - 8443:8443
      # HTTP fallback API port, only needed by the Chrome extension with a self-signed certificate. [OPTIONAL]
      - 8000:8000
      # Peer listener, only needed to join several servers into a cluster. [OPTIONAL]
      - 8444:8444
    restart: unless-stopped